name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
          cache: npm
          cache-dependency-path: desktop_ui/package-lock.json
      - name: Install core build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install Electron desktop runtime
        working-directory: desktop_ui
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Electron dependencies installation failed' }
          npm exec --no -- install-electron
          if ($LASTEXITCODE -ne 0) { throw 'Electron runtime installation failed' }
      - name: Verify public source and data
        run: |
          python -m unittest discover -s tests -p test_release_audit.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Release privacy tests failed' }
          python -m unittest discover -s tests -p test_public_data.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Public data tests failed' }
          python -m unittest discover -s tests -p test_app_paths.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Runtime path tests failed' }
          python -m unittest discover -s tests -p test_app_updates.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Application updater tests failed' }
          python -m unittest discover -s tests -p test_data_updates.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Music data update tests failed' }
          python -m unittest discover -s tests -p test_update_dialog.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Update dialog tests failed' }
          python release_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'Source audit failed' }
      - name: Build executable and source archive
        run: |
          $releaseVersion = python -c "from app_version import VERSION; print(VERSION)"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+([.-][A-Za-z0-9.-]+)?$') {
            throw 'Invalid release version'
          }
          python build_exe.py --version $releaseVersion --output-dir release --electron-runtime desktop_ui/node_modules/electron/dist
          if ($LASTEXITCODE -ne 0) { throw 'EXE build failed' }
          python package_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Source packaging failed' }
          $sourceArchive = Get-ChildItem release -Filter '*-source-*.zip' | Select-Object -First 1
          python tests/verify_source_distribution.py $sourceArchive.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Source archive verification failed' }
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' } |
            Sort-Object Name | ForEach-Object {
              '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
            } | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyLyricsOverlay-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseAssets = @(Get-ChildItem release -File | Where-Object {
            $_.Extension -in '.exe', '.zip' -or $_.Name -eq 'SHA256SUMS.txt'
          } | ForEach-Object { $_.FullName })
          gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'This release already exists; preserving its verified assets.'
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME @releaseAssets --verify-tag --title "Spotify Lyrics Overlay $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
