<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Spotify 가사창 연결</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>Spotify 가사창 연결</h1>
<p class="intro">Spotify 가사 없이도 문서 연결 · <span id="version"></span></p>
<button id="auto" type="button">Spotify 자동 연동 켜기</button>
<button id="retry" type="button" class="secondary" disabled>현재 곡 다시 연결</button>
<p id="auto-status" role="status">자동 연동 꺼짐</p>
<div id="candidates" aria-label="동명 가사 문서 후보"></div>
<label for="url">나무위키 · SideM KO 위키 문서 주소</label><input id="url" type="url" placeholder="https://sidem-ko.fandom.com/ko/wiki/…">
<label for="selector">표시할 영역의 CSS 선택자 <small>(선택)</small></label>
<input id="selector" type="text" placeholder="예: #lyrics 또는 .article-body">
<small>자동 연동은 빈 선택자에서 가사 표를 찾습니다. 수동 적용은 직접 영역을 고릅니다.</small>
<div class="row"><label for="size">글자 크기</label><input id="size" type="number" min="12" max="48" value="22"><span>px</span></div>
<label class="check"><input id="small" type="checkbox" checked> 별도 작은 창으로 열기</label>
<button id="open" type="button">원본 페이지 열고 적용</button>
<button id="current" type="button" class="secondary">현재 탭에 적용 / 영역 선택</button>
<button id="restore" type="button" class="secondary">현재 탭 원상복구</button>
<p id="status" role="status" aria-live="polite">현재 PC의 가사창으로 연결 · 앱은 확인한 가사를 PC에 저장해 다음 재생에 사용합니다.</p>
<script src="document_match.js"></script><script src="popup.js"></script></body></html>
