<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>아이마스 가사 오버레이</title>
  <link rel="icon" href="../resources/app.png" type="image/png">
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="appearance.css">
  <link rel="stylesheet" href="catalog.css">
  <link rel="stylesheet" href="developer.css">
  <script type="module" src="workspace.js"></script>
</head>
<body>
  <header class="workspace-bar">
    <nav aria-label="작업 화면">
      <div class="workspace-history" role="group" aria-label="화면 이동">
        <button type="button" data-history="-1" aria-label="뒤로" title="뒤로 (Alt+←)" disabled><span aria-hidden="true"></span></button>
        <button type="button" data-history="1" aria-label="앞으로" title="앞으로 (Alt+→)" disabled><span aria-hidden="true"></span></button>
      </div>
      <button type="button" data-view="appearance">가사 표시 설정</button>
      <button type="button" data-view="catalog">음악 사전</button>
      <button type="button" data-view="developer">개발자 모드</button>
    </nav>
  </header>
  <main id="workspace" tabindex="-1"></main>
</body>
</html>
